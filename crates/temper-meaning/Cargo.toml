[package]
name = "temper-meaning"
description = "The kernel's text embedder: multilingual-e5-small run in process, for search by meaning (ADR-0186)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gemm = { version = "0.18", default-features = false, features = ["std"] }
half = "2"
libm = "0.2"
spm_precompiled = "0.1"

[build-dependencies]
base64 = "0.22"
half = "2"
serde_json = "1"
sha2 = "0.10"
