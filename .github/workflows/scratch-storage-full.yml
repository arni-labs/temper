name: Scratch storage-full proof

# Temporary, on a scratch branch only: builds the Linux temper binary for the staging proof, and runs the new tests on
# the change and on three deliberate defects (each one main's behaviour for one part), which must fail.

on:
  push:
    branches: [scratch/storage-full-*]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  binary:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libz3-dev
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-binary
          save-if: false
      - run: cargo build --release --locked -p temper-cli
      - run: |
          set -euo pipefail
          mkdir -p out
          cp target/release/temper out/temper
          gzip -9 out/temper
          sha256sum out/temper.gz
      - uses: actions/upload-artifact@v4
        with:
          name: temper-x86_64-linux
          path: out/temper.gz
          retention-days: 3

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mutant: [none, room, reply, healthz]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libz3-dev
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: scratch-storage-full
      - name: Apply the deliberate defect
        run: |
          set -euo pipefail
          case "${{ matrix.mutant }}" in
            none) ;;
            # main has no floor: a disk under it refuses nothing.
            room) perl -0pi -e 's/(    fn check\(&self\) -> Result<\(\), PersistenceError> \{\n)/$1        return Ok(());\n/' crates/temper-server/src/storage/write_room.rs ;;
            # main answers a store failure as an ordinary failed action (409 ActionFailed).
            reply) perl -0pi -e 's/=> EntityResponse::store_unavailable\(state, said\)/=> EntityResponse::write_failed(state, said)/' crates/temper-server/src/entity_actor/actor.rs ;;
            # main's /healthz answers 200 whatever the store does.
            healthz) perl -0pi -e 's/(pub async fn healthz\(State\(state\): State<ServerState>\) -> Response \{\n)/$1    if true {\n        return (StatusCode::OK, axum::Json(serde_json::json!({ "ok": true }))).into_response();\n    }\n/' crates/temper-server/src/write_health.rs ;;
          esac
          git diff --stat
          git diff | head -40
      - name: The new tests
        run: |
          set +e
          cargo test -p temper-server --features sim --lib storage::write_room > unit.log 2>&1; unit=$?
          cargo test -p temper-server --features sim --test dst_store_write_recovery > dst.log 2>&1; dst=$?
          tail -40 unit.log
          tail -60 dst.log
          echo "mutant=${{ matrix.mutant }} unit=$unit dst=$dst"
          if [ "${{ matrix.mutant }}" = none ]; then
            [ "$unit" = 0 ] && [ "$dst" = 0 ]
          else
            [ "$unit" != 0 ] || [ "$dst" != 0 ]
          fi
