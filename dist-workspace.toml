[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Don't build on PRs (too heavy for this workspace)
pr-run-mode = "skip"
# Allow custom modifications to the generated CI workflow (e.g. npm publish step)
allow-dirty = ["ci"]

# Linux x86_64 builds and the global jobs (plan, host, announce) run on the organization's Ubuntu 22.04 larger runner:
# the same glibc as GitHub's ubuntu-22.04, without the standard runners' wait. release.yml is kept by hand
# (allow-dirty), so its literal runs-on lines name the same runner; `dist plan` reads this for the build matrix.
[dist.github-custom-runners]
global = "arni-ubuntu2204-4core"
x86_64-unknown-linux-gnu = { runner = "arni-ubuntu2204-4core", host = "x86_64-unknown-linux-gnu" }
