
# Scratch branch only: run every test, so each failing-first test shows.
[profile.default]
fail-fast = false
# The tests over a 300,000-row change log keep four periods for draining it
# with production trim code. The pinned release tursodb builds the fixture
# so debug-build inserts do not consume that budget before trimming starts.
# Their output is kept on success too: each trim's log line
# shows the drain rate. This entry comes first because the first matching
# override sets each setting.
[[profile.default.overrides]]
filter = 'binary(turso_sync) & (test(no_answer_waits_on_a_trim) | test(the_background_trim_clears_a_long_confirmed_log_in_budgeted_calls))'
slow-timeout = { period = "60s", terminate-after = 4 }
success-output = "final"

# The Turso Sync tests talk to a local sync server; a hang there should fail
# the test with its output, not hold the job until its own timeout.
[[profile.default.overrides]]
filter = 'binary(turso_sync)'
slow-timeout = { period = "60s", terminate-after = 2 }
